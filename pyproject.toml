[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solanabot"
version = "3.0.0"
description = "SolanaBot v3 — automated Solana meme coin trading bot"
requires-python = ">=3.11"
dependencies = [
    # Web / async
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "solana>=0.34",
    "solders>=0.21",
    "websockets>=12",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Config / validation
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    # Utilities
    "tenacity>=8.3",
    "structlog>=24.1",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "freezegun>=1.4",
    "factory-boy>=3.3",
    "coverage>=7",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["solanabot"]
omit = ["tests/*", "migrations/*"]
